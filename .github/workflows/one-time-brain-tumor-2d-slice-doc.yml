name: Patch brain tumor 2D slice documentation

on:
  push:
    paths:
      - '.github/workflows/one-time-brain-tumor-2d-slice-doc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch skill
        run: python .github/scripts/patch_brain_tumor_2d_slice.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DSI_STUDIO_AI_SKILL_BRAIN_TUMOR.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Specify 2D tumor-edge and tract callout rendering'
          git push
