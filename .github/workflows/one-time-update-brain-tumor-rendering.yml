name: One-time brain tumor rendering skill patch

on:
  push:
    paths:
      - '.github/workflows/one-time-update-brain-tumor-rendering.yml'

permissions:
  contents: write

jobs:
  patch-skill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch brain tumor skill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('DSI_STUDIO_AI_SKILL_BRAIN_TUMOR.md')
          text = path.read_text(encoding='utf-8')

          step1 = r'''### Brain surface for tumor location visualization

For all tumor-report 3D rendering, use the **`White_Matter` region produced by the
`human_tumor` segmentation as the brain envelope / spatial anchor**. This is the canonical
brain-surface representation for this workflow.

Do **not** use `add_surface`, a separate DSI surface object, or a separately generated
isosurface for the tumor report. Set `show_surface=0`; the checked `White_Matter` region
itself provides the translucent brain envelope.

The U-Net `White_Matter` output can contain disconnected fragments. Before using it for
presentation-quality 3D rendering, **defragment the `White_Matter` region** and visually
verify that the result is a coherent brain envelope. This cleanup is for the tissue-region
visualization only; do not apply it to `Necrosis`, `Peritumoral Edema`, or `Enhancing Tumor`
unless the user explicitly requests a segmentation edit.

Resolve the current `White_Matter` index from a fresh `list_region`, then run:

```bash
bash ./dsi.sh region_action_defragment <white-matter-index>
bash ./dsi.sh list_region
```

After defragmentation, keep DSI Studio's **original RGB values** for all tumor and tissue
regions and change **alpha only**. `list_region` displays region color as `#AARRGGBB`.
Preserve `RRGGBB` and replace only `AA` with the required alpha:

```text
White_Matter       alpha 10  = 0x0A
Necrosis           alpha 200 = 0xC8
Peritumoral Edema  alpha 80  = 0x50
Enhancing Tumor    alpha 100 = 0x64
```

Use `set_region_color` with the resulting unsigned 32-bit ARGB value. Do not substitute a
fixed RGB palette from another subject. For example, if `list_region` reports the tested
sub-003 RGB values, the resulting ARGB colors are:

```text
Necrosis           #c85b484e
Peritumoral Edema  #508397ab
Enhancing Tumor    #64bc6e71
White_Matter       #0ae7e7ee
```

After setting alpha, **move `White_Matter` to the bottom of the Region table so it is
rendered last**. Re-resolve indices while moving because each move changes row positions:

```bash
bash ./dsi.sh list_region
bash ./dsi.sh move_down_region <current-white-matter-index>
# repeat until White_Matter is the final row, checking list_region as needed
bash ./dsi.sh list_region
```

For the final tumor scene, hide the other tissue labels and show only the lesion
compartments plus `White_Matter`:

```text
Necrosis
Peritumoral Edema
Enhancing Tumor
White_Matter
```

`Gray_Matter`, `Cerebellar_Cortex`, `Basal_Ganglia`, and `Others` should normally be hidden
for these report figures unless one of them is specifically needed for anatomical context.
The tumor measurements remain based on the original lesion labels; the cleaned
`White_Matter` region is a visualization anchor, not part of Tumor Core.

'''
          text, n = re.subn(
              r'### Brain surface for tumor location visualization\n.*?(?=### Required checkpoint after Step 1)',
              step1,
              text,
              flags=re.S,
          )
          assert n == 1, f'expected one Step 1 surface section, found {n}'

          sec112 = r'''### 11.2 3D figures: direct DSI Studio exports with the segmentation-derived White_Matter brain envelope

The report's 3D figures must be **fresh direct DSI Studio saves**. Do not create the final
3D figure by inverting a black screenshot, replacing its background, hue-filtering an
all-tract image, or reconstructing missing anatomy in post-processing.

For tumor-report 3D scenes, start from the normal/default rendering state and apply the
following report preset. The brain envelope is the **defragmented `White_Matter` region from
`human_tumor` segmentation**. Do not use `add_surface`, a separate `surface` object, or a
separate isosurface for these figures.

#### Canonical tumor + brain-envelope rendering preset

1. Resolve all region rows by name from a fresh `list_region`.
2. Defragment `White_Matter` before presentation rendering:

```bash
bash ./dsi.sh region_action_defragment <white-matter-index>
bash ./dsi.sh list_region
```

3. Preserve each region's DSI Studio-assigned RGB and replace **alpha only**:

```text
Necrosis           alpha = 200
Peritumoral Edema  alpha = 80
Enhancing Tumor    alpha = 100
White_Matter       alpha = 10
```

`list_region` reports colors as `#AARRGGBB`; retain `RRGGBB`, replace `AA`, convert the
resulting ARGB value to the unsigned integer accepted by `set_region_color`, and apply it.
Do not copy RGB values from a previous subject.

4. Move `White_Matter` to the **last row of the Region table** so that it is rendered last.
Use `list_region` while moving because indices shift.
5. Hide other tissue labels and show only `Necrosis`, `Peritumoral Edema`,
   `Enhancing Tumor`, and `White_Matter` unless additional tissue anatomy is specifically
   required.
6. Do not show a separate DSI surface or structural slice in the 3D scene:

```bash
bash ./dsi.sh set_param show_surface 0
bash ./dsi.sh set_param show_slice 0
```

7. Use a **white 3D background** and keep it white until all required 3D figures are saved:

```bash
bash ./dsi.sh set_param bkg_color 16777215
```

The resulting 3D composition should show the very translucent cleaned `White_Matter`
envelope around the more opaque tumor compartments. The brain envelope is intentionally
subtle; it is present to establish location without obscuring tumor or tract anatomy.

#### Tract coloring in tumor + tract figures

Do **not** use directional tract coloring in the final tumor report. Use the tract's assigned
color and assign distinct bundle colors with clustering:

```bash
bash ./dsi.sh set_param tract_color_style 1
bash ./dsi.sh color_all_cluster
```

`tract_color_style=1` is **Assigned** color. For tract-specific figures, use
`show_only_tracts` so the scene contains one named tract at a time, while preserving that
bundle's assigned cluster color. For the all-tract overview, keep the distinct assigned
cluster colors so pathways remain visually separable.

#### Direct export

For each final 3D scene, set an explicit orthogonal view, read the camera orientation, save
at full resolution, and inspect the saved PNG itself:

```bash
bash ./dsi.sh set_view 2 0
bash ./dsi.sh get_camera
bash ./dsi.sh save_screen "<case>_axial3D.png" "1920 1080"

bash ./dsi.sh set_view 1 0
bash ./dsi.sh get_camera
bash ./dsi.sh save_screen "<case>_coronal3D.png" "1920 1080"
```

Use `save_screen` for the requested single orthogonal view. Do not substitute a left/right
stereo pair. If the saved image is missing the cleaned `White_Matter` brain envelope, a
tumor compartment, or the requested tract, return to DSI Studio and regenerate the scene.
Do not repair missing anatomy with post-hoc masking, recoloring, inversion, or synthesis.

'''
          text, n = re.subn(
              r'### 11\.2 3D figures:.*?(?=### 11\.3 2D slice figures)',
              sec112,
              text,
              flags=re.S,
          )
          assert n == 1, f'expected one 11.2 section, found {n}'

          sec117 = r'''### 11.7 Figure-generation order and state discipline

To reproduce the canonical tumor-report rendering without losing region order, alpha, or
tract color state:

1. Finish segmentation, tracking, T2R, and morphology measurements first.
2. Resolve the current region indices by name with `list_region`.
3. **Defragment `White_Matter`** with `region_action_defragment`; visually verify that the
   U-Net fragmentation artifact has been removed sufficiently for a coherent brain envelope.
4. Preserve DSI's original RGB and set alpha only:
   - `Necrosis` = 200
   - `Peritumoral Edema` = 80
   - `Enhancing Tumor` = 100
   - `White_Matter` = 10
5. Move `White_Matter` to the final Region-table row so it renders last. Re-run
   `list_region` as indices change.
6. Show only the three tumor compartments plus `White_Matter` for tumor 3D scenes.
7. Disable separate surfaces and 3D slices (`show_surface=0`, `show_slice=0`). Do **not**
   call `add_surface`; no separate isosurface is required.
8. Set the 3D background to white (`bkg_color=16777215`).
9. For tract figures, use **Assigned** tract color (`tract_color_style=1`) and run
   `color_all_cluster`; do not use directional tract color for final report figures.
10. Generate **all** required 3D figures in one pass while the rendering preset remains
    active: tumor only, all-tract overview, then each single-tract scene.
11. For every scene, set the explicit view (`set_view <0|1|2> 0`), call `get_camera`, save
    with `save_screen`, and inspect the full-resolution PNG.
12. Only after every 3D export passes visual QC may the display be changed for slice work.
13. Generate/retain the 2D structural figures on black background.
14. Assemble the PDF from the accepted direct DSI exports. Never replace a missing 3D scene
    by editing an older screenshot.

'''
          text, n = re.subn(
              r'### 11\.7 Figure-generation order and state discipline\n.*?(?=### 11\.8 Final report QC checklist)',
              sec117,
              text,
              flags=re.S,
          )
          assert n == 1, f'expected one 11.7 section, found {n}'

          # Replace report/QC language that referred to a separate surface or isosurface.
          replacements = {
              '[ ] tumor/brain isosurfaces are visibly present in each required 3D scene':
                  '[ ] defragmented White_Matter region is visibly present as the brain envelope in each required 3D scene',
              '[ ] no figure is visibly corrupted, missing its surface, or generated by post-hoc hue masking':
                  '[ ] no figure is visibly corrupted, missing its White_Matter brain envelope, or generated by post-hoc hue masking',
              '- tumor only + brain surface: at least axial and coronal':
                  '- tumor only + cleaned White_Matter brain envelope: at least axial and coronal',
              '- all selected tracts + tumor + brain surface: at least one overview, preferably two views':
                  '- all selected tracts + tumor + cleaned White_Matter brain envelope: at least one overview, preferably two views',
              '- each affected/clinically important tract + tumor + brain surface: two useful orthogonal views':
                  '- each affected/clinically important tract + tumor + cleaned White_Matter brain envelope: two useful orthogonal views',
              'whether the brain surface/tumor/tract are visibly present':
                  'whether the White_Matter brain envelope/tumor/tract are visibly present',
              '- synthesize a missing tumor or brain surface;':
                  '- synthesize a missing tumor or White_Matter brain envelope;',
              'Fresh direct white-background axial + coronal tumor/brain-surface 3D':
                  'Fresh direct white-background axial + coronal tumor + cleaned White_Matter brain-envelope 3D',
              'Fresh direct white-background all-tract + tumor + brain-surface 3D':
                  'Fresh direct white-background all-tract + tumor + cleaned White_Matter brain-envelope 3D',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise AssertionError(f'missing expected text: {old}')
              text = text.replace(old, new)

          # Strengthen the final QC checklist with the exact preset.
          qc_anchor = '[ ] all 3D figures use white background\n'
          qc_add = (
              '[ ] White_Matter comes from human_tumor segmentation, not add_surface or a separate isosurface\n'
              '[ ] White_Matter was defragmented/cleaned before final 3D rendering\n'
              '[ ] White_Matter alpha is 10 and White_Matter is the final Region-table row\n'
              '[ ] Necrosis / Peritumoral Edema / Enhancing Tumor alpha values are 200 / 80 / 100\n'
              '[ ] tumor-region RGB values are the original DSI-assigned RGB values\n'
              '[ ] final tract figures use Assigned cluster colors, not directional colors\n'
          )
          if qc_add.strip() not in text:
              if qc_anchor not in text:
                  raise AssertionError('QC anchor not found')
              text = text.replace(qc_anchor, qc_anchor + qc_add, 1)

          # Make Page 2 and all-tract/tract-page narrative explicit about the canonical envelope.
          text = text.replace(
              'On the same page include direct DSI Studio **tumor + brain-surface 3D views**, preferably\naxial and coronal, on a white background. The brain surface is required because it provides\nthe spatial anchor for tumor location.',
              'On the same page include direct DSI Studio **tumor + cleaned `White_Matter` brain-envelope\n3D views**, preferably axial and coronal, on a white background. The segmentation-derived\n`White_Matter` region is the required spatial anchor; do not substitute `add_surface` or a\nseparate isosurface.'
          )
          text = text.replace(
              'The tract-tumor section starts with an **all selected tracts + tumor + brain surface** 3D\noverview.',
              'The tract-tumor section starts with an **all selected tracts + tumor + cleaned `White_Matter`\nbrain envelope** 3D overview.'
          )
          text = text.replace(
              '1. **Direct DSI 3D figure with one tract only**, plus tumor compartments and brain surface.',
              '1. **Direct DSI 3D figure with one tract only**, plus tumor compartments and the cleaned `White_Matter` brain envelope.'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched skill
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DSI_STUDIO_AI_SKILL_BRAIN_TUMOR.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Use canonical White_Matter tumor rendering preset'
          git push
