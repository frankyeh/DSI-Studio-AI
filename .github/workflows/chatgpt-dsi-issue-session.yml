name: chatgpt-dsi-issue-session
run-name: chatgpt-dsi-issue-session

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub issue number used as the DSI Studio command channel
        required: true
        type: string
      debug:
        description: Enable diagnostic tracing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: dsi-studio-home-frank
  cancel-in-progress: false

jobs:
  session:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'DSI Studio session'))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Publish run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = 'pending'
            context = 'chatgpt-dsi-issue-session'
            description = 'DSI Studio issue session starting'
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Body $body | Out-Null

      - name: Run issue session
        id: session
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_DEBUG: ${{ inputs.debug }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $file = Invoke-RestMethod -Method Get -Headers $headers `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/.github/scripts/dsi_issue_session.ps1?ref=$env:GITHUB_SHA"
          $scriptPath = Join-Path $env:RUNNER_TEMP 'dsi_issue_session.ps1'
          [IO.File]::WriteAllBytes(
            $scriptPath,[Convert]::FromBase64String(($file.content -replace '\s','')))
          & $scriptPath

      - name: Publish result
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.session.outcome }}
        run: |
          if($env:RESULT -eq 'success')
          {
              $state = 'success'
              $description = 'DSI Studio issue session closed'
          }
          elseif($env:RESULT -eq 'cancelled')
          {
              $state = 'error'
              $description = 'DSI Studio issue session cancelled'
          }
          else
          {
              $state = 'failure'
              $description = 'DSI Studio issue session failed'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = $state
            context = 'chatgpt-dsi-issue-session'
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Body $body | Out-Null

  update-open-image-documentation:
    if: github.event_name == 'issues' && github.event.issue.title == 'Update DSI open_image documentation'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manual_path = Path("DSI_STUDIO_AI_MANUAL.md")
          manual = manual_path.read_text(encoding="utf-8")
          old = '''Open an ordinary image window:

```bash
bash ./dsi.sh main open_image "C:/data/T1w.nii.gz"
```

Parameterless main-window commands may open a local picker.'''
          new = '''Open a supported medical image window:

```bash
bash ./dsi.sh main open_image "C:/data/T1w.nii.gz"
```

`open_image` accepts NIfTI images and image formats supported by DSI Studio. It does
not open ordinary picture or screenshot formats such as `.jpg`, `.jpeg`, `.png`,
`.bmp`, `.gif`, `.webp`, `.tif`, or `.tiff`. A file created by `save_screen`,
`save_hd_screen`, `save_3view_screen`, `save_h3view_screen`, or
`save_v3view_screen` must not be passed to `open_image`. Verify screenshot output by
checking the filesystem or with an external picture viewer.

Parameterless main-window commands may open a local picker.'''
          if old not in manual:
              raise SystemExit("Expected opening-files block was not found")
          manual = manual.replace(old, new, 1)

          rule = "- Use `open_image` only for supported medical image volumes; never use it to open or verify JPG, PNG, or other screenshot files.\n"
          anchor = "- Copy exact paths, window IDs, indices, model IDs, and parameter IDs from the user,\n"
          if rule not in manual:
              if anchor not in manual:
                  raise SystemExit("Operational-rules anchor was not found")
              manual = manual.replace(anchor, rule + anchor, 1)
          manual_path.write_text(manual, encoding="utf-8")

          examples_path = Path("DSI_STUDIO_AI_COMMAND_EXAMPLES_GENERAL.md")
          examples = examples_path.read_text(encoding="utf-8")
          section = '''

## `open_image` input restriction

Use `open_image` only for NIfTI images and image formats supported by DSI Studio.
Do not pass ordinary picture or screenshot files such as `.jpg`, `.jpeg`, `.png`,
`.bmp`, `.gif`, `.webp`, `.tif`, or `.tiff`. In particular, outputs created by
`save_screen`, `save_hd_screen`, `save_3view_screen`, `save_h3view_screen`, or
`save_v3view_screen` are not valid `open_image` inputs. Verify those files through
the filesystem or an external picture viewer instead.
'''
          if "## `open_image` input restriction" not in examples:
              examples = examples.rstrip() + section + "\n"
              examples_path.write_text(examples, encoding="utf-8")
          PY

      - name: Commit documentation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DSI_STUDIO_AI_MANUAL.md DSI_STUDIO_AI_COMMAND_EXAMPLES_GENERAL.md
          git commit -m "Document open_image format restrictions"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: gh issue comment "${{ github.event.issue.number }}" --body "Updated the manuals at commit \`$SHA\`."
