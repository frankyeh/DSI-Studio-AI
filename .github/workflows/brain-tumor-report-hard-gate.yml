name: Harden brain tumor PDF report skill

on:
  push:
    paths:
      - '.github/workflows/brain-tumor-report-hard-gate.yml'

permissions:
  contents: write

jobs:
  patch-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch skill
        run: python .github/scripts/patch_brain_tumor_report_skill.py
      - name: Commit skill update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DSI_STUDIO_AI_SKILL_BRAIN_TUMOR.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Enforce brain tumor PDF report gate and figure quality'
          git push
