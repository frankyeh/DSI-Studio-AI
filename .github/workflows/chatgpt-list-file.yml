name: chatgpt-list-file
run-name: chatgpt-list-file

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, commit, or trigger
        required: false
        type: string
        default: trigger
      path:
        description: Repository path to list
        required: true
        type: string
        default: .
      max_results:
        description: Maximum paths printed directly in the log
        required: false
        type: number
        default: 5000
      max_total_bytes:
        description: Maximum UTF-8 bytes printed directly in the log
        required: false
        type: number
        default: 500000
      debug:
        description: Enable diagnostic command tracing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  list:
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-list-file.yml@f889a5543b8b80fc88810e47e42518d602a1d1b8
    with:
      ref: ${{ inputs.ref }}
      path: ${{ inputs.path }}
      max_results: ${{ inputs.max_results }}
      max_total_bytes: ${{ inputs.max_total_bytes }}
      debug: ${{ inputs.debug }}
