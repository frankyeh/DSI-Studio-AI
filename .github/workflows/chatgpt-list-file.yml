name: chatgpt-list-file
run-name: chatgpt-list-file-${{ github.run_id }}

# Standalone installation from frankyeh/AI-Skill@f889a5543b8b80fc88810e47e42518d602a1d1b8
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repository ref to list
        required: false
        default: main
        type: string
      path:
        description: Repository path to list
        required: false
        default: .
        type: string
      max_results:
        description: Maximum paths printed directly in the log
        required: false
        default: 5000
        type: number
      max_total_bytes:
        description: Maximum UTF-8 bytes printed directly in the log
        required: false
        default: 500000
        type: number
      debug:
        description: Enable diagnostic command tracing
        required: false
        default: false
        type: boolean
  issues:
    types: [opened]

permissions:
  contents: read
  statuses: write

jobs:
  list:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == 'chatgpt-list-file')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.list.outputs.count }}
      bytes: ${{ steps.list.outputs.bytes }}
      commit_sha: ${{ steps.list.outputs.commit_sha }}
      artifact: ${{ steps.list.outputs.artifact }}
      artifact_name: ${{ steps.list.outputs.artifact_name }}
    steps:
      - name: Publish run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          context="chatgpt-list-file/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="$context" \
            -f description='Tracked-file listing running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: List tracked files
        id: list
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_PATH: ${{ inputs.path }}
          DISPATCH_MAX_RESULTS: ${{ inputs.max_results }}
          DISPATCH_MAX_TOTAL_BYTES: ${{ inputs.max_total_bytes }}
          DISPATCH_DEBUG: ${{ inputs.debug }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == issues ]]; then
            readarray -t request < <(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          request = json.loads(event['issue']['body'])
          print(request.get('ref', 'main'))
          print(request.get('path', '.'))
          print(request.get('max_results', 5000))
          print(request.get('max_total_bytes', 500000))
          print(str(request.get('debug', False)).lower())
          PY
            )
            REF=${request[0]}; PATH_ROOT=${request[1]}; MAX_RESULTS=${request[2]}
            MAX_TOTAL_BYTES=${request[3]}; DEBUG=${request[4]}
          else
            REF=$DISPATCH_REF; PATH_ROOT=$DISPATCH_PATH; MAX_RESULTS=$DISPATCH_MAX_RESULTS
            MAX_TOTAL_BYTES=$DISPATCH_MAX_TOTAL_BYTES; DEBUG=$DISPATCH_DEBUG
          fi
          [[ "$DEBUG" == true || "$DEBUG" == false ]] || { echo 'debug must be true or false'; exit 1; }
          [[ "$MAX_RESULTS" =~ ^[0-9]+$ && "$MAX_RESULTS" -ge 1 && "$MAX_RESULTS" -le 100000 ]] || { echo 'max_results must be between 1 and 100000'; exit 1; }
          [[ "$MAX_TOTAL_BYTES" =~ ^[0-9]+$ && "$MAX_TOTAL_BYTES" -ge 1 && "$MAX_TOTAL_BYTES" -le 10000000 ]] || { echo 'max_total_bytes must be between 1 and 10000000'; exit 1; }
          if [[ "$DEBUG" == true ]]; then
            PS4='+ ${BASH_SOURCE##*/}:${LINENO}: '
            set -x
            trap 'rc=$?; echo "::error::line=$LINENO exit=$rc command=$BASH_COMMAND"; exit "$rc"' ERR
          fi
          valid_path() {
            local path=$1
            [[ "$path" == . ]] ||
              [[ -n "$path" && "$path" != /* && "$path" != -* && "$path" != *\\* &&
                 "$path" != .. && "$path" != ../* && "$path" != */../* &&
                 "$path" != */.. && ! "$path" =~ [[:cntrl:]] ]]
          }
          valid_path "$PATH_ROOT" || { echo 'invalid path'; exit 1; }
          if [[ -n "$REF" && "$REF" != trigger ]]; then
            [[ "$REF" != -* && ! "$REF" =~ [[:space:][:cntrl:]] ]] || { echo 'invalid ref'; exit 1; }
            git fetch --quiet --depth=1 origin "$REF"
            git checkout --quiet --detach FETCH_HEAD
          fi
          result=$RUNNER_TEMP/list-files.txt
          git -c core.quotePath=false ls-files -- "$PATH_ROOT" > "$result"
          count=$(wc -l < "$result")
          bytes=$(wc -c < "$result")
          commit_sha=$(git rev-parse HEAD)
          artifact=false
          artifact_name="chatgpt-list-file-$GITHUB_RUN_ID"
          (( count > MAX_RESULTS || bytes > MAX_TOTAL_BYTES )) && artifact=true
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "result_file=$result" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha"
          echo "path=$PATH_ROOT"
          echo "result_count=$count"
          echo "total_bytes=$bytes"
          if [[ "$artifact" == true ]]; then
            echo "complete_result_artifact=$artifact_name"
          else
            [[ "$DEBUG" != true ]] || set +x
            token=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
            echo "::stop-commands::$token"
            echo '--- files ---'
            cat "$result"
            echo "::$token::"
          fi

      - name: Upload complete listing
        if: steps.list.outputs.artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.list.outputs.artifact_name }}
          path: ${{ steps.list.outputs.result_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          COUNT: ${{ steps.list.outputs.count }}
          ARTIFACT: ${{ steps.list.outputs.artifact }}
        run: |
          case "$RESULT" in
            success)
              suffix=''
              [[ "$ARTIFACT" == true ]] && suffix='; full result in artifact'
              state=success; description="Tracked files: ${COUNT:-0}${suffix}" ;;
            cancelled) state=error; description='Tracked-file listing cancelled' ;;
            *) state=failure; description='Tracked-file listing failed' ;;
          esac
          context="chatgpt-list-file/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$context" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
