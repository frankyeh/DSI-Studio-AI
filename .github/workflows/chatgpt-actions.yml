name: chatgpt-actions
run-name: chatgpt-actions-${{ github.event.action }}

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: chatgpt-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      action: ${{ steps.request.outputs.action }}
      request_id: ${{ steps.request.outputs.request_id }}
      status_sha: ${{ steps.request.outputs.status_sha }}
      target_ref: ${{ steps.request.outputs.target_ref }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      ref: ${{ steps.request.outputs.ref }}
      mode: ${{ steps.request.outputs.mode }}
      query: ${{ steps.request.outputs.query }}
      path: ${{ steps.request.outputs.path }}
      max_results: ${{ steps.request.outputs.max_results }}
      max_total_bytes: ${{ steps.request.outputs.max_total_bytes }}
      files: ${{ steps.request.outputs.files }}
      sources: ${{ steps.request.outputs.sources }}
      destination_root: ${{ steps.request.outputs.destination_root }}
      target_paths: ${{ steps.request.outputs.target_paths }}
      overwrite: ${{ steps.request.outputs.overwrite }}
      message: ${{ steps.request.outputs.message }}
      patch_base64: ${{ steps.request.outputs.patch_base64 }}
      allow_delete: ${{ steps.request.outputs.allow_delete }}
      replacements: ${{ steps.request.outputs.replacements }}
      moves: ${{ steps.request.outputs.moves }}
      scope: ${{ steps.request.outputs.scope }}
      older_than_days: ${{ steps.request.outputs.older_than_days }}
      keep_latest: ${{ steps.request.outputs.keep_latest }}
      confirm: ${{ steps.request.outputs.confirm }}
      debug: ${{ steps.request.outputs.debug }}
    steps:
      - name: Validate control PR
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          [[ "$files" == '.github/chatgpt-trigger' ]] || { echo 'control PR must change only .github/chatgpt-trigger'; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pr, repo = event['pull_request'], event['repository']
          owner, default = repo['owner']['login'], repo['default_branch']

          def fail(message): raise SystemExit(message)
          if pr['state'] != 'open' or pr.get('draft'):
              fail('control PR must be normal and open')
          if pr['title'] != '[CONTROL - DO NOT MERGE] chatgpt-actions' or pr['base']['ref'] != default or pr['head']['ref'] != 'chatgpt-actions':
              fail('invalid control PR identity')
          if pr['head']['repo']['full_name'] != repo['full_name']:
              fail('fork control PR rejected')
          if pr['user']['login'] != owner or event['sender']['login'] != owner:
              fail('actor not approved')

          body = pr.get('body') or ''
          if not 1 <= len(body.encode('utf-8')) <= 50000:
              fail('invalid request size')
          try: request = json.loads(body)
          except json.JSONDecodeError as error: fail(f'invalid JSON: {error}')
          if not isinstance(request,dict) or set(request) != {'version','request_id','action','inputs'} or request['version'] != 1:
              fail('invalid request object')
          request_id, action, inputs = request['request_id'], request['action'], request['inputs']
          if not isinstance(request_id,str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,80}',request_id):
              fail('invalid request_id')
          allowed_actions={'list-file','search-repo','read-files','copy-files','apply-patch','replace-text','move-paths','cleanup-actions','validate-installation'}
          if action not in allowed_actions or not isinstance(inputs,dict):
              fail('unsupported action or invalid inputs')

          target_ref=default
          current_sha=subprocess.check_output(['gh','api',f'repos/{repo["full_name"]}/git/ref/heads/{default}','--jq','.object.sha'],text=True).strip()

          def boolean(name,default_value=False):
              value=inputs.get(name,default_value)
              if not isinstance(value,bool): fail(f'invalid {name}')
              return value
          def text(name,required=False,limit=20000,pattern=None,default_value=None):
              value=inputs.get(name,default_value)
              if required and value is None: fail(f'{name} is required')
              if value is None: return ''
              if not isinstance(value,str) or len(value.encode('utf-8'))>limit or any(ord(c)<32 or ord(c)==127 for c in value): fail(f'invalid {name}')
              if pattern and not re.fullmatch(pattern,value): fail(f'invalid {name}')
              return value
          def integer(name,default_value,low,high):
              value=inputs.get(name,default_value)
              if isinstance(value,bool) or not isinstance(value,int) or not low<=value<=high: fail(f'invalid {name}')
              return value
          def path_value(name,default_value='.',allow_dot=True):
              value=text(name,True,500,default_value=default_value)
              parts=value.split('/')
              valid=(allow_dot and value=='.') or (value and not value.startswith(('/', '-')) and '\\' not in value and all(part not in ('','.','..') for part in parts) and parts[0]!='.git')
              if not valid: fail(f'invalid {name}')
              return value
          def string_array(name,max_items=100):
              value=inputs.get(name)
              if not isinstance(value,list) or not 1<=len(value)<=max_items or not all(isinstance(x,str) for x in value) or len(set(value))!=len(value): fail(f'invalid {name}')
              for item in value:
                  if not item or any(ord(c)<32 or ord(c)==127 for c in item): fail(f'invalid {name}')
              return json.dumps(value,separators=(',',':'),ensure_ascii=False)

          values={'action':action,'request_id':request_id,'status_sha':pr['head']['sha'],'target_ref':target_ref,'base_sha':'','ref':default,'mode':'','query':'','path':'.','max_results':'5000','max_total_bytes':'500000','files':'','sources':'','destination_root':'','target_paths':'','overwrite':'false','message':'','patch_base64':'','allow_delete':'false','replacements':'','moves':'','scope':'','older_than_days':'30','keep_latest':'10','confirm':'','debug':str(boolean('debug')).lower()}

          if action=='list-file':
              allowed={'ref','path','max_results','max_total_bytes','debug'}
              values['ref']=text('ref',limit=200,pattern=r'[^\s\x00-\x1f]+',default_value=default)
              values['path']=path_value('path','.',True)
              values['max_results']=str(integer('max_results',5000,1,100000))
              values['max_total_bytes']=str(integer('max_total_bytes',500000,1,10000000))
          elif action=='search-repo':
              allowed={'ref','mode','query','path','max_results','max_total_bytes','debug'}
              values['ref']=text('ref',limit=200,pattern=r'[^\s\x00-\x1f]+',default_value=default)
              values['mode']=text('mode',True,20)
              if values['mode'] not in {'content','regex','filename','files'}: fail('invalid mode')
              values['query']=text('query',False,2000,default_value='')
              if values['mode']!='files' and not values['query']: fail('query is required')
              values['path']=path_value('path','.',True)
              values['max_results']=str(integer('max_results',2000,1,100000))
              values['max_total_bytes']=str(integer('max_total_bytes',500000,1,10000000))
          elif action=='read-files':
              allowed={'ref','files','max_total_bytes','debug'}
              values['ref']=text('ref',limit=200,pattern=r'[^\s\x00-\x1f]+',default_value=default)
              files_value=inputs.get('files')
              if not isinstance(files_value,list) or not 1<=len(files_value)<=20: fail('invalid files')
              values['files']=json.dumps(files_value,separators=(',',':'),ensure_ascii=False)
              values['max_total_bytes']=str(integer('max_total_bytes',1000000,1,1000000))
          elif action=='copy-files':
              allowed={'base_sha','sources','destination_root','target_paths','overwrite','message','debug'}
              values['base_sha']=text('base_sha',True,40,r'[0-9A-Fa-f]{40}')
              if values['base_sha']!=current_sha: fail(f'stale base_sha: current {default} is {current_sha}')
              values['sources']=string_array('sources',50)
              values['destination_root']=path_value('destination_root','.',True)
              values['target_paths']=string_array('target_paths')
              values['overwrite']=str(boolean('overwrite')).lower()
              values['message']=text('message',True,200)
          elif action=='apply-patch':
              allowed={'base_sha','target_paths','patch_base64','message','allow_delete','debug'}
              values['base_sha']=text('base_sha',True,40,r'[0-9A-Fa-f]{40}')
              if values['base_sha']!=current_sha: fail(f'stale base_sha: current {default} is {current_sha}')
              values['target_paths']=string_array('target_paths')
              values['patch_base64']=text('patch_base64',True,700000,r'[A-Za-z0-9+/=]+')
              values['message']=text('message',True,200)
              values['allow_delete']=str(boolean('allow_delete')).lower()
          elif action=='replace-text':
              allowed={'base_sha','target_paths','replacements','message','debug'}
              values['base_sha']=text('base_sha',True,40,r'[0-9A-Fa-f]{40}')
              if values['base_sha']!=current_sha: fail(f'stale base_sha: current {default} is {current_sha}')
              targets_json=string_array('target_paths'); targets=json.loads(targets_json)
              operations=inputs.get('replacements')
              if not isinstance(operations,list) or not 1<=len(operations)<=100: fail('invalid replacements')
              operation_paths=[]; seen=set(); payload=0
              for index,operation in enumerate(operations,1):
                  if not isinstance(operation,dict) or set(operation)!={'path','old','new','expected_count'}: fail(f'invalid replacement {index}')
                  path,old,new,count=operation['path'],operation['old'],operation['new'],operation['expected_count']
                  if path not in targets or not isinstance(old,str) or not isinstance(new,str) or not old or old==new or '\x00' in old or '\x00' in new: fail(f'invalid replacement {index}')
                  if isinstance(count,bool) or not isinstance(count,int) or not 1<=count<=100000: fail(f'invalid expected_count {index}')
                  if len(old.encode())>250000 or len(new.encode())>250000: fail(f'replacement text too large {index}')
                  payload+=len(old.encode())+len(new.encode())
                  if (path,old) in seen: fail(f'duplicate replacement {index}')
                  seen.add((path,old)); operation_paths.append(path)
              if payload>500000 or sorted(set(operation_paths))!=sorted(targets): fail('invalid replacement payload or paths')
              values['target_paths']=targets_json
              values['replacements']=json.dumps(operations,separators=(',',':'),ensure_ascii=False)
              values['message']=text('message',True,200)
          elif action=='move-paths':
              allowed={'base_sha','moves','target_paths','overwrite','message','debug'}
              values['base_sha']=text('base_sha',True,40,r'[0-9A-Fa-f]{40}')
              if values['base_sha']!=current_sha: fail(f'stale base_sha: current {default} is {current_sha}')
              moves_value=inputs.get('moves')
              if not isinstance(moves_value,list) or not 1<=len(moves_value)<=50: fail('invalid moves')
              values['moves']=json.dumps(moves_value,separators=(',',':'),ensure_ascii=False)
              values['target_paths']=string_array('target_paths')
              values['overwrite']=str(boolean('overwrite')).lower()
              values['message']=text('message',True,200)
          elif action=='cleanup-actions':
              allowed={'scope','older_than_days','keep_latest','confirm','debug'}
              values['scope']=text('scope',True,20)
              if values['scope'] not in {'chatgpt','all'}: fail('invalid scope')
              values['older_than_days']=str(integer('older_than_days',30,1,3650))
              values['keep_latest']=str(integer('keep_latest',10,0,100))
              values['confirm']=text('confirm',True,20)
              if values['confirm']!='DELETE': fail('confirm must be DELETE')
          else:
              allowed={'debug'}

          if set(inputs)-allowed: fail(f'unexpected inputs: {sorted(set(inputs)-allowed)}')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as stream:
              for name,value in values.items(): stream.write(f'{name}={value}\n')
          PY

  list-file:
    needs: validate
    if: needs.validate.outputs.action == 'list-file'
    permissions: {contents: read, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-list-file.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      ref: ${{ needs.validate.outputs.ref }}
      path: ${{ needs.validate.outputs.path }}
      max_results: ${{ fromJSON(needs.validate.outputs.max_results) }}
      max_total_bytes: ${{ fromJSON(needs.validate.outputs.max_total_bytes) }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  search-repo:
    needs: validate
    if: needs.validate.outputs.action == 'search-repo'
    permissions: {contents: read, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-search-repo.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      ref: ${{ needs.validate.outputs.ref }}
      mode: ${{ needs.validate.outputs.mode }}
      query: ${{ needs.validate.outputs.query }}
      path: ${{ needs.validate.outputs.path }}
      max_results: ${{ fromJSON(needs.validate.outputs.max_results) }}
      max_total_bytes: ${{ fromJSON(needs.validate.outputs.max_total_bytes) }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  read-files:
    needs: validate
    if: needs.validate.outputs.action == 'read-files'
    permissions: {contents: read, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-read-files.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      ref: ${{ needs.validate.outputs.ref }}
      files: ${{ needs.validate.outputs.files }}
      max_total_bytes: ${{ fromJSON(needs.validate.outputs.max_total_bytes) }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  copy-files:
    needs: validate
    if: needs.validate.outputs.action == 'copy-files'
    permissions: {contents: write, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-copy-files.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      target_ref: ${{ needs.validate.outputs.target_ref }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      sources: ${{ needs.validate.outputs.sources }}
      destination_root: ${{ needs.validate.outputs.destination_root }}
      target_paths: ${{ needs.validate.outputs.target_paths }}
      overwrite: ${{ fromJSON(needs.validate.outputs.overwrite) }}
      message: ${{ needs.validate.outputs.message }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  apply-patch:
    needs: validate
    if: needs.validate.outputs.action == 'apply-patch'
    permissions: {contents: write, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-apply-patch.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      target_ref: ${{ needs.validate.outputs.target_ref }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      target_paths: ${{ needs.validate.outputs.target_paths }}
      patch_base64: ${{ needs.validate.outputs.patch_base64 }}
      message: ${{ needs.validate.outputs.message }}
      allow_delete: ${{ fromJSON(needs.validate.outputs.allow_delete) }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  replace-text:
    needs: validate
    if: needs.validate.outputs.action == 'replace-text'
    permissions: {contents: write, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-replace-text.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      target_ref: ${{ needs.validate.outputs.target_ref }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      target_paths: ${{ needs.validate.outputs.target_paths }}
      replacements: ${{ needs.validate.outputs.replacements }}
      message: ${{ needs.validate.outputs.message }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  move-paths:
    needs: validate
    if: needs.validate.outputs.action == 'move-paths'
    permissions: {contents: write, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-move-paths.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      target_ref: ${{ needs.validate.outputs.target_ref }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      moves: ${{ needs.validate.outputs.moves }}
      target_paths: ${{ needs.validate.outputs.target_paths }}
      overwrite: ${{ fromJSON(needs.validate.outputs.overwrite) }}
      message: ${{ needs.validate.outputs.message }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  cleanup-actions:
    needs: validate
    if: needs.validate.outputs.action == 'cleanup-actions'
    permissions: {actions: write, contents: read, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-cleanup-actions.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      scope: ${{ needs.validate.outputs.scope }}
      older_than_days: ${{ fromJSON(needs.validate.outputs.older_than_days) }}
      keep_latest: ${{ fromJSON(needs.validate.outputs.keep_latest) }}
      confirm: ${{ needs.validate.outputs.confirm }}
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}

  validate-installation:
    needs: validate
    if: needs.validate.outputs.action == 'validate-installation'
    permissions: {contents: read, pull-requests: read, statuses: write}
    uses: frankyeh/AI-Skill/.github/workflows/chatgpt-validate-installation.yml@d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
    with:
      request_id: ${{ needs.validate.outputs.request_id }}
      status_sha: ${{ needs.validate.outputs.status_sha }}
      expected_library_sha: d8bb10b4010ddfafffe6d98e06a3cfed4f9633d6
      router_path: .github/workflows/chatgpt-actions.yml
      required_actions: '["list-file","search-repo","read-files","copy-files","apply-patch","replace-text","move-paths","cleanup-actions","validate-installation"]'
      debug: ${{ fromJSON(needs.validate.outputs.debug) }}
