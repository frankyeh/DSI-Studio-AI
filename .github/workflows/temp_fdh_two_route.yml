name: Temporary Fiber Data Hub documentation patch

on:
  push:
    branches: [chatgpt-fdh-two-route-doc]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Fiber Data Hub documentation edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text()
          old = "## 7. Fiber Data Hub\n\nAll Hub commands target `main`. Switch back first when necessary:"
          new = "## 7. Fiber Data Hub\n\nFiber Data Hub supports two access routes: direct web/GitHub access and DSI Studio\n`hub_*` commands. Both are valid. Choose the route that best fits the task and\navailable tools.\n\nFor dataset discovery, release metadata, QC lookup, file listing, and downloading\npublic assets, an agent may work directly from https://brain.labsolver.org and the\ncorresponding GitHub releases without routing through DSI Studio. The direct-access\nguide is maintained in `frankyeh/Brain-Data`:\nhttps://github.com/frankyeh/Brain-Data/blob/gh-pages/AGENTS.md\n\nUse the DSI Studio route below when it is convenient or when the task needs DSI\nStudio to open, visualize, track, or analyze Hub data. If one route is unavailable,\nuse the other when it can satisfy the same request. Do not force either route when\nthe other is simpler.\n\nAll DSI Studio Hub commands target `main`. Switch back first when necessary:"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)
          p.write_text(s)
          PY

          git rm .github/workflows/temp_fdh_two_route.yml
          git add AGENTS.md
          git diff --cached --check
          git config user.name 'Fang-Cheng (Frank) Yeh'
          git config user.email 'frank.yeh@gmail.com'
          git commit -m 'Document both Fiber Data Hub access routes'
          git push origin HEAD:chatgpt-fdh-two-route-doc
